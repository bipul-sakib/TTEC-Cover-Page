<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTEC Cover Page Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Crimson+Pro:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1e6b3e;
    --green-dark: #134d2b;
    --green-light: #eaf5ee;
    --green-mid: #c8e0d0;
    --text: #1a2218;
    --muted: #5a6b58;
    --border: #b8d4c0;
    --red: #a81c1c;
    --bg: #f0f7f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hind Siliguri', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 48px;
  }

  /* ── HEADER ── */
  .top-bar {
    width: 100%;
    background: white;
    border-bottom: 2px solid var(--green-mid);
    padding: 14px 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-bottom: 28px;
  }
  .top-bar .header-logos {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 7px;
  }
  /* ttec-logo: 54px — set via inline or here */
  .top-bar .header-logos .logo-ttec { height: 54px; width: auto; object-fit: contain; }
  .top-bar h1 {
    font-family: 'Crimson Pro', serif;
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--text);
  }
  .top-bar p { font-size: 0.83rem; color: var(--muted); }

  /* ── CARD ── */
  .card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 2px 20px rgba(20,80,40,0.10);
    width: 100%;
    max-width: 500px;
    padding: 26px 24px 22px;
    margin: 0 14px;
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-bottom: 13px; }
  .field-row.full { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 0.79rem; font-weight: 600; color: var(--text); }
  label .req { color: var(--red); }

  input, select {
    padding: 8px 11px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 0.87rem;
    color: var(--text);
    background: #fafcfa;
    outline: none;
    width: 100%;
    transition: border-color 0.15s, box-shadow 0.15s;
    appearance: none; -webkit-appearance: none;
  }
  input::placeholder { color: #b0bcae; }
  input:focus, select:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(30,107,62,0.10);
    background: white;
  }
  .sel-wrap { position: relative; }
  .sel-wrap::after {
    content: '▾'; position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%); color: var(--muted);
    pointer-events: none; font-size: 0.85rem;
  }
  .sel-wrap select { padding-right: 26px; cursor: pointer; }

  .divider { height: 1px; background: var(--green-mid); margin: 16px 0; }

  .sub-box {
    border: 1.5px dashed var(--green);
    border-radius: 9px;
    padding: 14px 14px 10px;
    background: var(--green-light);
    margin-bottom: 14px;
  }
  .sub-box-label { font-size: 0.88rem; font-weight: 700; color: var(--green-dark); margin-bottom: 11px; }

  .btn-dl {
    width: 100%; padding: 12px;
    background: var(--green); color: white;
    border: none; border-radius: 8px;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 0.97rem; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(30,107,62,0.28);
    transition: background 0.15s, transform 0.12s;
  }
  .btn-dl:hover { background: var(--green-dark); transform: translateY(-1px); }

  .footer { margin-top: 18px; font-size: 0.76rem; color: var(--muted); text-align: center; font-family: 'Courier New', monospace; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(70px);
    background: #134d2b; color: white;
    padding: 11px 26px; border-radius: 40px;
    font-size: 0.88rem; font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    opacity: 0; transition: transform 0.3s, opacity 0.3s;
    z-index: 999; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 520px) {
    .field-row { grid-template-columns: 1fr; }
    .card { padding: 18px 13px; }
  }
</style>
</head>
<body>

<!-- ══════════ HEADER ══════════ -->
<div class="top-bar">
  <div class="header-logos">
    <!-- TTEC College Logo (54×54 px PNG, transparent bg) -->
    <img class="logo-ttec" src="images/ttec-logo.png" alt="TTEC Logo" onerror="this.style.display='none'">
  </div>
  <h1>Cover Page Generator</h1>
  <p>Tangail Textile Engineering College — Fill in the details below.</p>
</div>

<!-- ══════════ FORM CARD ══════════ -->
<div class="card">

  <div class="field-row">
    <div class="field">
      <label>Department <span class="req">*</span></label>
      <div class="sel-wrap">
        <select id="department">
          <option value="">Select Department</option>
          <option>Apparel Engineering</option>
          <option>Wet Processing Engineering</option>
          <option>Fabric Engineering</option>
           <option>Yarn Engineering</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Report Type <span class="req">*</span></label>
      <div class="sel-wrap">
        <select id="reportType">
          <option value="">Select Type</option>
          <option>PRACTICAL</option>
          <option>ASSIGNMENT</option>
          <option>REPORT</option>
          <option>PROJECT</option>
          <option>TERM PAPER</option>
          <option>THESIS</option>
          <option>LAB REPORT</option>
        </select>
      </div>
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Subject Name <span class="req">*</span></label>
      <input type="text" id="subjectName" placeholder="e.g. Fabric Structure & Design">
    </div>
    <div class="field">
      <label>Subject Code <span class="req">*</span></label>
      <input type="text" id="subjectCode" placeholder="e.g. FE-306">
    </div>
  </div>

  <div class="field-row full">
    <div class="field">
      <label>Experiment Name / Topic (Optional, Use incase of Individual Lab report and Assignment)</label>
      <input type="text" id="topic" placeholder="e.g. Plain Weave Structure Analysis">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Student Name <span class="req">*</span></label>
      <input type="text" id="studentName" placeholder="Full Name">
    </div>
    <div class="field">
      <label>Roll Number <span class="req">*</span></label>
      <input type="text" id="studentRoll" placeholder="e.g. 22070401019">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Level & Term <span class="req">*</span></label>
      <div class="sel-wrap">
        <select id="levelTerm">
          <option value="">Select Level-Term</option>
          <option>Level-1 Term-1</option><option>Level-1 Term-2</option>
          <option>Level-2 Term-1</option><option>Level-2 Term-2</option>
          <option>Level-3 Term-1</option><option>Level-3 Term-2</option>
          <option>Level-4 Term-1</option><option>Level-4 Term-2</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Session <span class="req">*</span></label>
      <div class="sel-wrap">
        <select id="session">
          <option value="">Select Session</option>
          <option>2018-2019</option><option>2019-2020</option>
          <option>2020-2021</option><option>2021-2022</option>
          <option>2022-2023</option><option>2023-2024</option>
          <option>2024-2025</option><option>2025-2026</option>
          <option>2026-2027</option><option>2027-2028</option>
          <option>2028-2029</option><option>2029-2030</option>
          <option>2030-2031</option><option>2031-2032</option>
          <option>2032-2032</option><option>2032-2033</option>
          <option>2033-2034</option><option>2034-2035</option>
        </select>
      </div>
    </div>
  </div>

  <div class="field-row full">
    <div class="field">
      <label>Submission Date(Optional, Use incase of Individual Lab report and Assignment)</label>
      <input type="date" id="submissionDate">
    </div>
  </div>

  <div class="divider"></div>

  <div class="sub-box">
    <div class="sub-box-label">📌 Submitted To</div>
    <div class="field-row">
      <div class="field">
        <label>Teacher Name <span class="req">*</span></label>
        <input type="text" id="teacherName" placeholder="e.g. Md. Saiful Islam">
      </div>
      <div class="field">
        <label>Designation <span class="req">*</span></label>
        <input type="text" id="teacherDesig" placeholder="e.g. Chief Instructor">
      </div>
    </div>
  </div>

  <button class="btn-dl" onclick="downloadCover()">⬇ Download Cover Page</button>
</div>

<div class="footer">Developed by Sakib Hasan Bipul | TTEC, AE-14th</div>
<div class="toast" id="toast"></div>

<!-- ══════════ SCRIPT ══════════ -->
<script>
function v(id){ return document.getElementById(id).value.trim(); }

function showToast(msg, dur=3500){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function getImgBase64(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      resolve(c.toDataURL());
    };
    img.onerror = () => resolve(null);
    img.src = src + '?t=' + Date.now();
  });
}

async function downloadCover(){
  const req = [
    ['department','Department'],['reportType','Report Type'],
    ['subjectName','Subject Name'],['subjectCode','Subject Code'],
    ['levelTerm','Level & Term'],['session','Session'],
    ['studentName','Student Name'],['studentRoll','Roll Number'],
    ['teacherName','Teacher Name'],['teacherDesig','Designation'],
  ];
  for(const [id,label] of req){
    if(!v(id)){ showToast('⚠ Please fill: '+label); document.getElementById(id).focus(); return; }
  }

  const dept      = v('department'),
        type      = v('reportType'),
        subject   = v('subjectName'),
        code      = v('subjectCode'),
        topic     = v('topic'),
        levelTerm = v('levelTerm'),
        session   = v('session'),
        sName     = v('studentName'),
        sRoll     = v('studentRoll'),
        dateRaw   = v('submissionDate'),
        tName     = v('teacherName'),
        tDesig    = v('teacherDesig');

  const dateStr = dateRaw
    ? new Date(dateRaw).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})
    : '';

  const bdLogo64      = await getImgBase64('images/bd-logo.png');
  const ttecLogo64    = await getImgBase64('images/ttec-logo.png');
  const watermark64   = await getImgBase64('images/watermark.png');

  // Logos HTML — sizes exactly matching original cover page
  const bdHTML   = bdLogo64   ? `<img src="${bdLogo64}"   style="height:58px;width:auto;object-fit:contain;">` : '';
  const ttecHTML = ttecLogo64 ? `<img src="${ttecLogo64}" style="height:120px;width:auto;object-fit:contain;">` : '';

  // Watermark CSS — positioned behind all content at 70% size
  const watermarkCSS = watermark64
    ? `.page::before{content:'';position:absolute;inset:0;background-image:url('${watermark64}');background-size:70%;background-position:center;background-repeat:no-repeat;opacity:0.15;z-index:0;}`
    : '';

  const topicHTML = topic
    ? `<p style="font-size:14px;font-weight:bold;color:#1e6b3e;text-align:center;margin-top:5px;">Experiment/Topic: ${topic}</p>`
    : '';
  const dateHTML = dateStr
    ? `<p style="font-size:13px;text-align:center;color:#555;margin-top:4px;">Date of Submission: ${dateStr}</p>`
    : '';

  const html = `<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Times New Roman',Times,serif;background:white;}
.page{
  width:210mm;height:297mm;
  padding:16mm 20mm 14mm;
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
}

/* ── content ── */
.govt{font-size:13px;font-weight:bold;text-align:center;margin-bottom:7px;position:relative;z-index:2;}
.logo-row{display:flex;align-items:center;justify-content:center;margin-bottom:7px;position:relative;z-index:2;}
.cn{font-size:24px;font-weight:1000;color:#1a3480;text-align:center;
    text-transform:uppercase;letter-spacing:0.02em;margin-bottom:2px;font-family:'Arial Black',sans-serif;position:relative;z-index:2;}
.loc{font-size:13px;color:#444;text-align:center;margin-bottom:9px;position:relative;z-index:2;}
.ttec-logo{display:flex;align-items:center;justify-content:center;margin-bottom:9px;position:relative;z-index:2;}
.hr{width:65%;height:1px;background:linear-gradient(90deg,transparent,#1e6b3e,transparent);margin:6px auto;position:relative;z-index:2;}
.deg{font-size:19px;font-weight:bold;color:#1a6b8a;text-align:center;margin-bottom:2px;font-family:Arial,sans-serif;position:relative;z-index:2;}
.aff{font-size:13px;color:#444;text-align:center;position:relative;z-index:2;}
.uni{font-size:15px;font-weight:bold;color:#1a3480;text-align:center;margin-bottom:9px;font-family:Arial,sans-serif;position:relative;z-index:2;}
.badge{background:#1e6b3e;color:white;font-size:18px;font-weight:bold;
       letter-spacing:0.1em;padding:9px 55px;display:inline-block;
       font-family:Arial,sans-serif;margin:9px 0 11px;position:relative;z-index:2;}
.dept{font-size:21px;font-weight:bold;color:#8b0000;text-align:center;margin-bottom:4px;font-family:Arial,sans-serif;position:relative;z-index:2;}
.lvl{font-size:14px;color:#1a1a1a;text-align:center;line-height:1.9;margin-bottom:9px;position:relative;z-index:2;}
.sb{position:relative;z-index:2;}
.sb p{font-size:15px;font-weight:bold;line-height:2;text-align:center;}
.dev-info{font-family:'Courier New',monospace;font-size:11px;color:#666;text-align:center;margin-top:8px;position:relative;z-index:2;}

/* table always ~70mm from bottom */
.spacer{flex:1;min-height:8px;max-height:25mm;}
table{width:100%;border-collapse:collapse;border:2px solid #000;margin-top:10px;position:relative;z-index:2;}
td{padding:13px 18px;vertical-align:top;border:1.5px solid #000;width:50%;font-size:13.5px;line-height:1.85;}
.ch{font-size:15.5px;font-weight:bold;text-align:center;
    border-bottom:1.5px solid #000;padding-bottom:7px;margin-bottom:9px;display:block;}

${watermarkCSS}

@media print{@page{margin:0;size:A4;}body{margin:0;}}
</style></head>
<body><div class="page">

<p class="govt">Government of the People's Republic of Bangladesh</p>

${bdHTML   ? `<div class="logo-row">${bdHTML}</div>`   : ''}

<p class="cn">Tangail Textile Engineering College</p>
<p class="loc">Kalihati, Tangail</p>

${ttecHTML ? `<div class="ttec-logo">${ttecHTML}</div>` : ''}

<div class="hr"></div>

<p class="deg">B.Sc. in Textile Engineering</p>
<p class="aff">Affiliated by</p>
<p class="uni">Bangladesh University of Textiles (BUTex)</p>
<div class="hr"></div>

<div><span class="badge">${type}</span></div>

<p class="dept">Department of ${dept}</p>
<p class="lvl">${levelTerm}<br>Session: ${session}</p>

<div class="sb">
  <p>Subject Name: ${subject}</p>
  <p>Subject Code: ${code}</p>
</div>

${topicHTML}
${dateHTML}

<div class="spacer"></div>

<table><tr>
  <td>
    <span class="ch">Submitted To</span>
    <strong>${tName}</strong><br>
    ${tDesig}<br>
    Tangail Textile Engineering College<br>
    Kalihati, Tangail
  </td>
  <td>
    <span class="ch">Submitted By</span>
    Name &nbsp;: ${sName}<br>
    Roll &nbsp;&nbsp;&nbsp;: ${sRoll}<br>
    Dept &nbsp;&nbsp;: ${dept}
  </td>
</tr></table>

</div></body></html>`;

  const win = window.open('','_blank','width=920,height=760');
  win.document.write(html);
  win.document.close();
  
  // Set filename for PDF download: Subject Name_Subject Code.pdf
  const filename = `${subject}_${code}.pdf`;
  
  win.onload = () => setTimeout(() => { 
    win.focus(); 
    win.print(); 
    // Try to set filename (works in some browsers when printing to PDF)
    if(win.document.title) win.document.title = filename;
  }, 800);
  
  showToast('✅ Cover page ready! Save as PDF: ' + filename, 4000);
}
</script>
</body>
</html>
