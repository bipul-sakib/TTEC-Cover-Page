<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTEC Cover Page Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Crimson+Pro:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1e6b3e;
    --green-dark: #134d2b;
    --green-light: #eaf5ee;
    --green-mid: #c8e0d0;
    --text: #1a2218;
    --muted: #5a6b58;
    --border: #b8d4c0;
    --red: #a81c1c;
    --bg: #f0f7f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Hind Siliguri', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 48px;
    position: relative;
  }
  
  /* ── HEADER ── */
  .top-bar {
    width: 100%;
    background: white;
    border-bottom: 2px solid var(--green-mid);
    padding: 14px 20px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-bottom: 28px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }
  .top-bar .header-logos {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 7px;
  }
  .top-bar .header-logos .logo-ttec { height: 54px; width: auto; object-fit: contain; }
  .top-bar h1 {
    font-family: 'Crimson Pro', serif;
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--text);
  }
  .top-bar p { font-size: 0.83rem; color: var(--muted); }

  /* ── CARD ── */
  .card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(20,80,40,0.15);
    width: 100%;
    max-width: 500px;
    padding: 26px 24px 22px;
    margin: 0 14px;
  }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin-bottom: 13px; }
  .field-row.full { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 0.79rem; font-weight: 600; color: var(--text); }
  label .req { color: var(--red); }

  input, select {
    padding: 8px 11px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 0.87rem;
    color: var(--text);
    background: #fafcfa;
    outline: none;
    width: 100%;
    transition: border-color 0.15s, box-shadow 0.15s;
    appearance: none; -webkit-appearance: none;
  }
  input::placeholder { color: #b0bcae; }
  input:focus, select:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(30,107,62,0.10);
    background: white;
  }
  .sel-wrap { position: relative; }
  .sel-wrap::after {
    content: '▾'; position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%); color: var(--muted);
    pointer-events: none; font-size: 0.85rem;
  }
  .sel-wrap select { padding-right: 26px; cursor: pointer; }

  .divider { height: 1px; background: var(--green-mid); margin: 16px 0; }

  .sub-box {
    border: 1.5px dashed var(--green);
    border-radius: 9px;
    padding: 14px 14px 10px;
    background: var(--green-light);
    margin-bottom: 14px;
  }
  .sub-box-label { font-size: 0.88rem; font-weight: 700; color: var(--green-dark); margin-bottom: 11px; }

  .btn-dl {
    width: 100%; padding: 12px;
    background: var(--green); color: white;
    border: none; border-radius: 8px;
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 0.97rem; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(30,107,62,0.28);
    transition: background 0.15s, transform 0.12s;
  }
  .btn-dl:hover { background: var(--green-dark); transform: translateY(-1px); }
  .btn-dl:disabled { background: #7aaa8e; cursor: not-allowed; transform: none; opacity: 0.8; }

  .bangla-instruction {
    margin-top: 15px;
    font-size: 0.85rem;
    color: var(--green-dark);
    text-align: center;
    background-color: var(--green-light);
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--green-mid);
    line-height: 1.4;
  }

  .footer { margin-top: 18px; font-size: 0.76rem; color: var(--muted); text-align: center; font-family: 'Courier New', monospace; line-height: 1.5; }
  .footer .inspiration { margin-bottom: 4px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(70px);
    background: #134d2b; color: white;
    padding: 11px 26px; border-radius: 40px;
    font-size: 0.88rem; font-weight: 600;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    opacity: 0; transition: transform 0.3s, opacity 0.3s;
    z-index: 999; pointer-events: none;
    max-width: 90%;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ══════════ PRINT UI & LAYOUT STYLES ══════════ */
  @media screen {
    #print-container { display: none; }
  }

  @media print {
    /* Hide the website UI */
    body > :not(#print-container) { display: none !important; }
    
    html, body {
      background: white !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 210mm !important;
      height: 297mm !important;
      max-height: 297mm !important;
      overflow: hidden !important; 
    }

    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    @page {
      size: A4 portrait;
      margin: 0mm; 
    }

    #print-container {
      display: block !important;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
  }

  /* ══════════ SPECIFIC COVER PAGE STYLES ══════════ */
  
  #cover-page {
    width: 210mm;
    height: 296mm;
    max-height: 296mm;
    padding: 40px 76px 120px 76px; 
    box-sizing: border-box;
    background: white;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    page-break-after: avoid;
    page-break-inside: avoid;
    font-family: 'Times New Roman', Times, serif !important; 
    color: #000;
  }
  
  /* Forces all standard text to strictly use Times New Roman */
  #cover-page * {
    font-family: 'Times New Roman', Times, serif !important; 
  }

  #cover-page .logo-row { display:flex; align-items:center; justify-content:center; margin-bottom:2px; position:relative; z-index:2; }
  
  /* Government Text: Times New Roman, Bold */
  #cover-page .govt { font-size:14px; font-weight:bold; text-align:center; margin-bottom:2px; position:relative; z-index:2; }
  
  /* College Name: Arial Black, Uppercase, Dark Blue */
  #cover-page .cn { 
    font-size:24px; font-weight:900; color:#1a3480; text-align:center; text-transform:uppercase; 
    letter-spacing:0.02em; margin-bottom:2px; 
    font-family: 'Arial Black', Arial, sans-serif !important; 
    position:relative; z-index:2; 
  }
  
  /* Location: Times New Roman */
  #cover-page .loc { font-size:16px; color:#444; text-align:center; margin-bottom:3px; position:relative; z-index:2; }
  #cover-page .ttec-logo { display:flex; align-items:center; justify-content:center; margin-bottom:3px; position:relative; z-index:2; }
  #cover-page .hr { width:65%; height:1px; background:linear-gradient(90deg,transparent,#1e6b3e,transparent); margin:3px auto; position:relative; z-index:2; }
  
  /* Degree: Arial, Teal, Bold */
  #cover-page .deg { font-size:22px; font-weight:bold; color:#1a6b8a; text-align:center; margin-bottom:1px; font-family: Arial, sans-serif !important; position:relative; z-index:2; }
  
  /* Affiliation & BUTex: Times New Roman */
  #cover-page .aff { font-size:16px; color:#444; text-align:center; position:relative; z-index:2; }
  #cover-page .uni { font-size:18px; font-weight:bold; color:#1a3480; text-align:center; margin-bottom:4px; position:relative; z-index:2; }
  
  /* Badge (Practical, etc.): Arial, White on Green */
  #cover-page .badge { 
    background:#1e6b3e; color:white; font-size:20px; font-weight:bold; letter-spacing:0.1em; 
    padding:6px 52px; display:inline-block; font-family: Arial, sans-serif !important; margin:4px 0 6px; 
    position:relative; z-index:2; -webkit-print-color-adjust:exact; print-color-adjust:exact; 
  }
  
  /* Department: Arial, Dark Red, Bold */
  #cover-page .dept { font-size:24px; font-weight:bold; color:#8b0000; text-align:center; margin-bottom:6px; font-family: Arial, sans-serif !important; position:relative; z-index:2; }
  
  /* The rest is Times New Roman */
  #cover-page .lvl { font-size:18.5px; color:#1a1a1a; text-align:center; line-height:1.4; margin:0 0 8px 0; position:relative; z-index:2; }
  #cover-page .sb { position:relative; z-index:2; margin-bottom:8px; }
  #cover-page .sb p { font-size:19.5px; font-weight:bold; line-height:1.5; text-align:center; margin:0 0 8px 0; }
  #cover-page .topic-text { font-size:18px; font-weight:bold; color:#1e6b3e; text-align:center; margin:8px 0; position:relative; z-index:2; }
  #cover-page .date-text { font-size:16px; text-align:center; color:#555; margin-top:3px; position:relative; z-index:2; }
  
  #cover-page .spacer { flex:1; } 
  
  /* Table: Times New Roman */
  #cover-page table { width:100%; border-collapse:collapse; border:2px solid #000; position:relative; z-index:2; }
  #cover-page td { padding:12px 15px; vertical-align:top; border:1.5px solid #000; width:50%; font-size:17px; line-height:1.75; }
  #cover-page .ch { font-size:18px; font-weight:bold; text-align:center; border-bottom:1.5px solid #000; padding-bottom:6px; margin-bottom:7px; display:block; }

  @media (max-width: 520px) {
    .field-row { grid-template-columns: 1fr; }
    .card { padding: 18px 13px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="header-logos">
    <img class="logo-ttec" src="images/ttec-logo.png" alt="TTEC Logo" onerror="this.style.display='none'">
  </div>
  <h1>Cover Page Generator</h1>
  <p>Tangail Textile Engineering College — Fill in the details below.</p>
</div>

<div class="card">

  <div class="field-row">
    <div class="field">
      <label>Department <span class="req">*</span></label>
      <div class="sel-wrap">
        <select id="department">
          <option value="">Select Department</option>
          <option>Apparel Engineering</option>
          <option>Wet Processing Engineering</option>
          <option>Fabric Engineering</option>
          <option>Yarn Engineering</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Report Type <span class="req">*</span></label>
      <div class="sel-wrap">
        <select id="reportType">
          <option value="">Select Type</option>
          <option>PRACTICAL</option>
          <option>ASSIGNMENT</option>
          <option>REPORT</option>
          <option>PROJECT</option>
          <option>TERM PAPER</option>
          <option>THESIS</option>
          <option>LAB REPORT</option>
        </select>
      </div>
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Subject Name <span class="req">*</span></label>
      <input type="text" id="subjectName" placeholder="e.g. Fabric Structure & Design">
    </div>
    <div class="field">
      <label>Subject Code <span class="req">*</span></label>
      <input type="text" id="subjectCode" placeholder="e.g. FE-306">
    </div>
  </div>

  <div class="field-row full">
    <div class="field">
      <label>Experiment Name / Topic (Optional)</label>
      <input type="text" id="topic" placeholder="e.g. Plain Weave Structure Analysis">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Student Name <span class="req">*</span></label>
      <input type="text" id="studentName" placeholder="Full Name">
    </div>
    <div class="field">
      <label>Roll Number <span class="req">*</span></label>
      <input type="text" id="studentRoll" placeholder="e.g. 22070401019">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label>Level & Term <span class="req">*</span></label>
      <div class="sel-wrap">
        <select id="levelTerm">
          <option value="">Select Level-Term</option>
          <option>Level-1 Term-1</option><option>Level-1 Term-2</option>
          <option>Level-2 Term-1</option><option>Level-2 Term-2</option>
          <option>Level-3 Term-1</option><option>Level-3 Term-2</option>
          <option>Level-4 Term-1</option><option>Level-4 Term-2</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>Session <span class="req">*</span></label>
      <div class="sel-wrap">
        <select id="session">
          <option value="">Select Session</option>
          <option>2018-2019</option><option>2019-2020</option>
          <option>2020-2021</option><option>2021-2022</option>
          <option>2022-2023</option><option>2023-2024</option>
          <option>2024-2025</option><option>2025-2026</option>
        </select>
      </div>
    </div>
  </div>

  <div class="field-row full">
    <div class="field">
      <label>Submission Date (Optional)</label>
      <input type="date" id="submissionDate">
    </div>
  </div>

  <div class="divider"></div>

  <div class="sub-box">
    <div class="sub-box-label">📌 Submitted To</div>
    <div class="field-row">
      <div class="field">
        <label>Teacher Name <span class="req">*</span></label>
        <input type="text" id="teacherName" placeholder="e.g. Md. Saiful Islam">
      </div>
      <div class="field">
        <label>Designation <span class="req">*</span></label>
        <input type="text" id="teacherDesig" placeholder="e.g. Chief Instructor">
      </div>
    </div>
  </div>

  <button class="btn-dl" id="downloadBtn" onclick="generateAndPrint()">🖨️ Save as PDF / Print</button>

  <div class="bangla-instruction">
    <strong>নির্দেশনা:</strong> 'Save as PDF / Print' বাটনে ক্লিক করার পর, প্রিন্ট মেনু থেকে <strong>'Save as PDF'</strong> সিলেক্ট করুন।
  </div>

</div>

<div class="footer">
  <div class="inspiration">Design inspiration: Al-Amin Bhai | TTEC, YE-13th</div>
  <div>Developed by Sakib Hasan Bipul | TTEC, AE-14th</div>
</div>

<div class="toast" id="toast"></div>

<div id="print-container"></div>

<script>
function v(id){ return document.getElementById(id).value.trim(); }

let toastTimer = null;
function showToast(msg, dur=3500){
  const t = document.getElementById('toast');
  if(toastTimer) clearTimeout(toastTimer);
  t.textContent = msg; t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), dur);
}

// Check if user is inside an in-app browser (Messenger, Facebook, etc.)
function isInAppBrowser() {
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  return (ua.indexOf("FBAN") > -1) || (ua.indexOf("FBAV") > -1) || (ua.indexOf("Instagram") > -1) || (ua.indexOf("Messenger") > -1);
}

// Function to preload images so they are ready for the print dialog
function preloadImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(url);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

async function generateAndPrint(){
  
  // If the user is on Messenger or Facebook browser, window.print() will fail. Give them a warning!
  if (isInAppBrowser()) {
    alert("⚠️ সতর্কতা: আপনি মেসেঞ্জার বা ফেসবুক ব্রাউজার ব্যবহার করছেন, তাই PDF সেভ করা যাচ্ছে না। \n\nদয়া করে লিংকটি কপি করে Google Chrome বা Safari ব্রাউজারে ওপেন করুন।");
    return;
  }

  const req = [
    ['department','Department'],['reportType','Report Type'],
    ['subjectName','Subject Name'],['subjectCode','Subject Code'],
    ['levelTerm','Level & Term'],['session','Session'],
    ['studentName','Student Name'],['studentRoll','Roll Number'],
    ['teacherName','Teacher Name'],['teacherDesig','Designation'],
  ];
  
  for(const [id,label] of req){
    if(!v(id)){ showToast('⚠ Please fill: '+label); document.getElementById(id).focus(); return; }
  }

  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Preparing PDF...';

  // Extract values
  const dept = v('department'), type = v('reportType'),
        subject = v('subjectName'), code = v('subjectCode'),
        topic = v('topic'), levelTerm = v('levelTerm'),
        session = v('session'), sName = v('studentName'),
        sRoll = v('studentRoll'), dateRaw = v('submissionDate'),
        tName = v('teacherName'), tDesig = v('teacherDesig');

  const dateStr = dateRaw
    ? new Date(dateRaw).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})
    : '';

  // Preload images to ensure they appear in the print preview
  await Promise.all([
    preloadImage('images/bd-logo.png'),
    preloadImage('images/ttec-logo.png'),
    preloadImage('images/watermark.png')
  ]);

  const bdHTML = `<img src="images/bd-logo.png" style="height:58px;width:auto;object-fit:contain;display:block;">`;
  const ttecHTML = `<img src="images/ttec-logo.png" style="height:115px;width:auto;object-fit:contain;display:block;">`;
  const watermarkHTML = `<img src="images/watermark.png" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:70%; height:auto; opacity:0.12; z-index:0; pointer-events:none;">`;
  const topicHTML = topic ? `<p class="topic-text">Experiment/Topic: ${topic}</p>` : '';
  const dateHTML = dateStr ? `<p class="date-text">Date of Submission: ${dateStr}</p>` : '';

  const coverHTML = `
    <div id="cover-page">
      ${watermarkHTML}
      <div class="logo-row">${bdHTML}</div>
      <p class="govt">Government of the People&#39;s Republic of Bangladesh</p>
      <p class="cn">Tangail Textile Engineering College</p>
      <p class="loc">Kalihati, Tangail</p>
      <div class="ttec-logo">${ttecHTML}</div>
      <div class="hr"></div>
      <p class="deg">B.Sc. in Textile Engineering</p>
      <p class="aff">Affiliated by</p>
      <p class="uni">Bangladesh University of Textiles (BUTex)</p>
      <div class="hr"></div>
      <div><span class="badge">${type}</span></div>
      <p class="dept">Department of ${dept}</p>
      
      <p class="lvl">${levelTerm}</p>
      <p class="lvl">Session: ${session}</p>
      
      <div class="sb">
        <p>Subject Name: ${subject}</p>
        <p>Subject Code: ${code}</p>
      </div>
      ${topicHTML}
      ${dateHTML}
      <div class="spacer"></div>
      <table><tr>
        <td>
          <span class="ch">Submitted To</span>
          <strong>${tName}</strong><br>
          ${tDesig}<br>
          Tangail Textile Engineering College<br>
          Kalihati, Tangail
        </td>
        <td>
          <span class="ch">Submitted By</span>
          Name&nbsp;&nbsp;: ${sName}<br>
          Roll&nbsp;&nbsp;&nbsp;&nbsp;: ${sRoll}<br>
          Dept&nbsp;&nbsp;&nbsp;: ${dept}
        </td>
      </tr></table>
    </div>
  `;

  // Inject the HTML
  document.getElementById('print-container').innerHTML = coverHTML;

  // Give the browser slightly more time to register the DOM changes
  setTimeout(() => {
    const originalTitle = document.title;
    document.title = `${subject}_${code}_CoverPage`; 
    
    // Call Native Print
    try {
      window.print(); 
    } catch(err) {
      showToast("❌ Print failed. Please use Chrome/Safari.", 4000);
    }
    
    document.title = originalTitle; // Revert the title
    
    // Reset the button
    btn.disabled = false;
    btn.textContent = '🖨️ Save as PDF / Print';
    
  }, 800);
}
</script>
</body>
</html>
